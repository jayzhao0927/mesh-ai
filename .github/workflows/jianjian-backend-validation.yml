name: Jianjian backend validation

on:
  workflow_dispatch:
  push:
    branches: [codex/jianjian-backend-validation]
    paths: ['jianjian/**', '.github/workflows/jianjian-backend-validation.yml']
  pull_request:
    paths: ['jianjian/**', '.github/workflows/jianjian-backend-validation.yml']

permissions:
  contents: read

jobs:
  real-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jianjian
    env:
      DATABASE_URL: postgres://mesh:mesh@localhost:5432/mesh
      TEST_DATABASE_URL: postgres://mesh:mesh@localhost:5432/mesh_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jianjian/package-lock.json
      - run: npm ci
      - name: Compile
        run: npm run typecheck && npm run build
      - name: Start API, PostgreSQL and Redis through Compose
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Migrate and seed
        run: npm run migrate && npm run seed
      - name: Rules against real PostgreSQL
        run: npm test
      - name: HTTP end-to-end smoke
        run: bash scripts/smoke.sh
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color > compose-validation.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jianjian-compose-log
          path: jianjian/compose-validation.log
      - name: Stop isolated services
        if: always()
        run: docker compose down -v
